name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: TypeScript / ESLint / Prettier / Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm tsc --noEmit

      - name: Test
        run: pnpm test

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm prettier --check .

      - name: Build
        run: pnpm build
        env:
          # ビルド時に必要な最低限の env (実値は Vercel が注入)
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@ep-ci-placeholder.us-east-1.aws.neon.tech/ci' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'placeholder-secret-for-ci' }}
          NEXTAUTH_URL: http://localhost:3000
